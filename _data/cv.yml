    "contents": [
      {
        "title": "Kyushu University, Department of Aeronautics and Astronautics",
        "description": [
          "<strong>Undergraduate Thesis:</strong> <em>A Study on Nonlinear SGS Models for LES Based on the Tensor Basis Neural Network Using Machine Learning</em>",
          "Achieved accuracy comparable to using all 10 of Pope's tensor bases with only the first four (T<sup>(1)</sup>–T<sup>(4)</sup>) in <em>a posteriori</em> simulations of channel flow at Re<sub>τ</sub> = 395, reducing velocity overprediction primarily in the buffer and outer layers relative to conventional isotropic models.",
          "Investigating T<sup>(6)</sup> as a potential extension of conventional strain-rate-tensor-based SGS models, motivated by its linear dependence on the strain-rate tensor in laminar channel flow.",
          "Reduced mean-velocity relative L<sub>2</sub> error against DNS from 19.54% with a conventional isotropic model to 3.73% by learning only the coefficient of the isotropic tensor T<sup>(6)</sup>, without incorporating anisotropic tensor terms, using a composite loss function that equally evaluates both the normalized anisotropy tensor and physical stress scale instead of the standard loss function evaluating only the SGS stress anisotropy tensor."
        ],
        "year": "Apr 2026 – Present",
        "institution": "Undergraduate Researcher · Advisor: Prof. Kenichi Abe"
      },
      {
        "title": "Kyushu University, Faculty of Agriculture",
