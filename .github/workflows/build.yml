name: Build academic website
on:
  push:
    branches: [main, "prototype/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - uses: actions/upload-artifact@v4
        with:
          name: academic-website
          path: _site
